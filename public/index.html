<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Juice Shop clone</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 60px auto; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    #msg { margin-top: 16px; min-height: 1.2em; }
    .err { color: #b00; } .ok { color: #070; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="text" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <button type="submit">Log in</button>
  </form>
  <p id="msg"></p>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    // Client-side validation: block empty submits, require "@", require >= 8 chars.
    function clientValidate(email, password) {
      if (!email || !password) return 'Email and password are required.';
      if (!email.includes('@')) return 'Email must contain "@".';
      if (password.length < 8) return 'Password must be at least 8 characters.';
      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;

      const clientError = clientValidate(email, password);
      if (clientError) { show(clientError, false); return; }

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      show(data.message, data.ok);
    });

    // textContent (never innerHTML) — server reply is shown as text, so markup
    // like <script> is displayed, not executed. This is the client-side XSS guard.
    function show(text, ok) {
      msg.textContent = text;
      msg.className = ok ? 'ok' : 'err';
    }
  </script>
</body>
</html>
